# Stage 4: GSPO with timeline, duration, and translation-quality rewards.
# Run: torchrun --nproc_per_node=${NUM_GPUS} gspo_train.py --config-name gspo_stage4_rl
# Set data_root and ckpt_root, or override paths.* with Hydra.
# Replace dataset paths with your own Parquet files or shard directories.

paths:
  data_root: ${oc.env:data_root,/path/to/data}
  ckpt_root: ${oc.env:ckpt_root,/path/to/checkpoints}
  base_model: ${oc.env:base_model,${paths.ckpt_root}/Qwen3-ASR-1.7B}
  token2wav_root: ${oc.env:token2wav_root,${paths.ckpt_root}/Fun-CosyVoice3-0.5B}
  metricx_root: ${oc.env:metricx_root,${paths.ckpt_root}/metricx-24-hybrid-xxl-v2p6-bfloat16}

common:
  _name: transdubber-stage4
  seed: 42
  num_nodes: 1
  output_dir: ${paths.ckpt_root}/rl/${common._name}
checkpoint:
  save_every_n_steps: 10
  strict_model_load: true
  resume_ckpt_path: ${paths.ckpt_root}/sft/transdubber-stage3/checkpoints/last.ckpt
  required_init_checkpoint: ${paths.ckpt_root}/sft/transdubber-stage3/checkpoints/last.ckpt
dataset:
  seed: ${common.seed}
  num_workers: 4
  batch_size: 1
  sampling_rate: 16000
  train_parquet_dir:
  - ${paths.data_root}/stage4/train
  dev_parquet_dir:
  - ${paths.data_root}/stage4/dev
  pin_memory: true
  prefetch_factor: 2
  rl_min_silence: 0.4
  rl_max_silence: 1.0
  rl_source_vad_offset: 0.2
model:
  model_path: ${paths.base_model}
  train_param_dtype: float32
  ref_param_dtype: bfloat16
  compute_dtype: bfloat16
  special_tokens:
  - <s2st_text>
  - <s2st_eos>
  - <|speech_codec|>
  - <pause>
  speech_codec_offset: 151936
  speech_codec_size: 6561
  expected_special_token_ids:
    <s2st_text>: 151705
    <s2st_eos>: 151706
    <|speech_codec|>: 151707
    <pause>: 151708
optimization:
  lr: 3.0e-06
  max_epoch: 5
  max_steps: 100
  warmup_ratio: 0.05
  log_steps: 5
  max_grad_norm: 1.0
  max_runtime_minutes: 230
  compile_ref: false
  compile_policy: false
  optimizer:
    adam_betas_0: 0.9
    adam_betas_1: 0.999
    adam_eps: 1.0e-06
  lr_scheduler:
    type: cosine
    peak_lr: 1.0
gspo:
  reward_type: combined
  quality_weight: 0.2
  pause_weight: 1.0
  duration_weight: 1.0
  quality_use_reference: false
  adv_std_floor: 0.05
  adv_clip: 3.0
  metricx_model_dir: ${paths.metricx_root}
  metricx_repo: ${paths.metricx_root}/metricx
  metricx_tokenizer: google/mt5-xl
  metricx_max_input_length: 1536
  metricx_max_score: 25.0
  metricx_batch_size: 16
  token2wav_flow_model: ${paths.token2wav_root}/flow.pt
  token2wav_hift_model: ${paths.token2wav_root}/hift.pt
  token2wav_campplus_model: ${paths.token2wav_root}/campplus.onnx
  token2wav_speech_tokenizer_model: ${paths.token2wav_root}/speech_tokenizer_v3.onnx
  token2wav_fp16: true
  token2wav_n_timesteps: 2
  token2wav_cfg: false
  pause_vad_sample_rate: 16000
  pause_vad_threshold: 0.8
  pause_min_speech_ms: 250
  pause_min_silence_ms: 100
  pause_speech_pad_ms: 30
  pause_backend: timeline
  pause_strict_min_silence_ms: 480
  pause_dense_min_silence_ms: 120
  pause_dense_weight: 0.35
  pause_collar: 0.1
  pause_added_silence_lambda: 0.15
  pause_added_silence_cap: 2.0
  pause_added_free_fraction: 0.05
  pause_target_core_floor: 0.4
  pause_duration_gate_tolerance: 0.25
  pause_duration_gate_floor: -1.0
  pause_drop_edge_silence: true
  pause_no_speech_reward: 0.0
  pause_eps: 1.0e-06
  extreme_filter: false
  keep_top_k: 4
  keep_bottom_k: 4
  mask_mode: ''
  clip_eps_low: 0.2
  clip_eps_high: 0.28
  kl_coef: 0.01
  kl_adaptive: false
  kl_target: 0.07
  kl_horizon: 30.0
  kl_coef_min: 1.0e-06
  kl_coef_max: 1.0
  ce_coef: 0.0
